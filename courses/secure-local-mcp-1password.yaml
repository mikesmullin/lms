      - id: d
        text: It removes the need for any access control on local tools
    explanation: |
      The point of the integration is to keep secret handling anchored to the trusted local app and CLI, instead of pushing plaintext credentials into prompts, files, or shell history.

  - id: secret-references-not-secret-values
    type: concept
    title: Use Secret References, Not Secret Values
    content: |
      This is the most important operational habit in the whole course.

      In the 1Password desktop app, you can right-click a secret field and choose:

      `Copy Secret Reference`

      That gives you a reference like:

      ```text
      op://vault/item/field
      ```

      You can verify a reference resolves correctly with:

      ```bash
      op read "op://vault/item/field"
      ```

      And you can safely place a reference in an env file like:

      ```env
      DB_PASSWORD=op://vault/item/field
      ```

      This is dramatically safer than copying the actual password because:

      - the reference can live in config safely relative to the secret
      - the secret is only resolved at runtime
      - the agent or tool can be given an address instead of the credential itself

      A good mental model is: **references travel, secrets stay home**.

  - id: where-secret-refs-fit-in-mcp
    type: concept
    title: Where Secret References Fit in an MCP Toolchain
    content: |
      In a secure local MCP workflow, the tool configuration can store a secret reference while the trusted local layer resolves it only when needed.

      Example pattern:

      1. MCP-related config stores `op://...` references
      2. A local wrapper or MCP server resolves the reference at runtime with `op`
      3. The downstream API call receives the real token
      4. The model never sees that raw token

      In an ordinary local app, the same pattern often looks like:

      ```bash
      op run --env-file=.env -- node hello-world.mjs
      ```

      Here, the `.env` file holds only `op://` pointers, while `op run` resolves them and injects the real values into the process environment at startup.

      In practice, there are three useful patterns:

      1. **Explicit named vars**: name the specific environment variables you want resolved for the command you are launching.

        ```bash
        OPENAI_API_KEY=op://vault/openai/api_key op run -- node app.mjs
        ```

      2. **.env file**: point `op run` at a file like `.env` and let it resolve every `op://...` reference in that file.

        ```bash
        op run --env-file=.env -- node app.mjs
        ```

      3. **Env**: Use `export` to set `op://` references in your shell, then prefix your command with `op run`. It will scan the current environment, resolve any `op://` values, and inject the real secrets into the subprocess environment only.

        ```bash
        # 1. store the reference, not the secret (the secret is in 1Password desktop app)
        $ export MYSECRET=op://vault/openai/api_key

        # 2. resolve op:// refs and run
        # NOTICE: first run causes 1Password desktop app to prompt you to allow password decryption.
        $ op run -- node -e "require('fs').writeFileSync('/tmp/x', process.env.MYSECRET);"
        $ cat /tmp/x
        YOUR_SECRET_STRING!

        # NOTICE: if you try to print a secret via stdio, `op` will redact it this way:
        $ op run -- node -e "console.log(process.env.MYSECRET)"
        <concealed by 1Password>
        ```

      **A note on scope and security**: there is a meaningful difference between running your entire agent harness under `op run` versus only wrapping specific tool calls.

      - **Harness-level** (`op run -- copilot --experimental`): every subprocess the agent spawns inherits the resolved values. The LLM could reach secrets (ie. shell tool: `env` cmd) so this is less secure.
      - **Tool-call-level** (`op run -- node make-api-call.mjs`): only the specific subprocess that needs a secret receives it, and only for the duration of that call. The agent harness itself never holds the resolved value. The LLM could reach secrets (ie. if the tool subprocess divulges) but its less likely.

      The tool-call-level approach is more secure. An agent would have to deliberately write a script that writes to disk to exfiltrate a secret — that is still a risk, but a narrower one.

      The same rule applies to MCP config files such as `mcp.json`: keep raw secrets out of the config, store references or env-variable placeholders there, and let a trusted local wrapper or runtime resolve the real values just-in-time.

      This is the same architectural lesson repeated throughout secure agent engineering:

      > the model should decide **what** to do, but trusted local infrastructure should decide **how secrets are applied**.

  - id: codex-and-1password-mcp
    type: concept
    title: "Codex Integration: A Glimpse of the Better Pattern"
    content: |
      The most interesting frontier reference in this space is 1Password's Codex-oriented MCP guidance.

      The reason it matters is conceptual:

      - secrets can stay inside a dedicated secret-management system
      - the MCP layer can mediate access for the coding agent
      - the agent can use environment-aware tooling without directly holding the secret payload
      - user approval and local mediation can happen before any sensitive runtime action is taken

      In other words, the official 1Password MCP direction is not just "store secrets better". It is "make secret use a first-class, tool-mediated runtime capability without sending the secret back into model context".

      Reference:

      - [1Password MCP Server for Codex](https://www.1password.dev/environments/mcp-codex-server)

      Even if your exact setup differs, the principle is strong: **make secret use tool-mediated and local, not prompt-mediated and ad hoc**.

  - id: operational-rules
    type: concept
    title: Practical Rules for Secure Local Secret Handling
    content: |
      If you want a short operator checklist, use these rules:

      - store secrets in 1Password, not in prompts or docs
      - pass secret references where possible, not raw values
      - resolve secrets at runtime in a trusted local tool layer
      - prefer local MCP or local wrappers over shell snippets that expose tokens casually
      - do not treat `.copilotignore`, prompt instructions, or "please don't read this file" as a real secret boundary
      - if an agent has shell or file access, assume any readable secret file can eventually be opened with something as simple as `cat`
      - if an agent can modify the app, assume it could add logging or exfiltration paths unless you constrain and review its changes
      - use app-backed local auth for development, and service accounts for automation or CI
      - audit and rotate secrets if they were ever pasted into logs, chats, or configs

      If you follow these five rules, your agent workflow is already much safer than the common "paste an API key into a file and hope" pattern.

  - id: flashcards-1password-mcp
    type: challenge
    kind: flashcards
    title: Secure Local MCP w/ 1Password — Flashcard Review
    cards:
      - front: What is the core rule for secrets in an agentic workflow?
        back: The agent should almost never see the plaintext secret. Secret storage, reference, and use should be separated.
      - front: What does the 1Password desktop app integration do for the CLI?
        back: It lets the local CLI authenticate through the trusted desktop app, reducing secret sprawl and improving local security and UX.
      - front: What is a 1Password secret reference?
        back: A reference like `op://vault/item/field` that points to a secret without containing the secret value itself.
      - front: Why are secret references safer than copying raw secrets?
        back: Because they let config and tooling carry an address while the actual secret is resolved only at runtime by a trusted layer.
      - front: In a secure local MCP setup, who should resolve the secret?
        back: A trusted local tool or MCP server should resolve it at runtime, not the LLM itself.
      - front: What is the main architectural lesson from the 1Password Codex MCP guidance?
        back: Secret use should be mediated by tools and local infrastructure, not by pasting raw credentials into prompts or config.

  - id: final-quiz
    type: challenge
    kind: multiple-choice
    title: Final Check — Secure Local MCP w/ 1Password
    question: Which setup best matches the secure pattern taught in this course?
    choices:
      - id: a
        text: Put the API key directly into the system prompt so the agent can use it freely
      - id: b
        text: Store the real token in a shared config file and let the agent read the file whenever needed
      - id: c
        text: Store the secret in 1Password, keep a secret reference in config, and let a trusted local tool or MCP server resolve it at runtime
        correct: true
      - id: d
        text: Paste the secret into shell history each time so the token is never saved in a file
    explanation: |
      The secure pattern is to keep the real secret in 1Password, pass references instead of raw values where possible, and let trusted local infrastructure resolve and apply the secret at runtime.