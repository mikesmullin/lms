id: secure-local-mcp-1password
title: "Secure Local MCP w/ 1Password"
description: "Learn how to keep agentic secrets out of prompts and config files by using 1Password CLI, secret references, and a local MCP-friendly workflow."
icon: key
version: "1.0"
tags:
  - AI
  - MCP
  - Security
  - 1Password
  - Secrets
  - Local Tools

steps:

  - id: why-agentic-secrets-need-a-system
    type: concept
    title: Why Agentic Secrets Need a Real System
    content: |
      If you are building local agent workflows, secrets are one of the first places where a casual setup becomes dangerous.

      Common failure modes look like this:

      - API keys pasted into prompts
      - tokens committed to `.env` files and shared loosely
      - config files duplicated across machines
      - agents or tools receiving the raw secret when they only needed a reference
      - debugging flows that print env vars, tool inputs, or stack traces containing secrets
      - prompt injection or bad tool design causing the model to ask for, log, or echo credential material
      - agents with write access to your app modifying code to dump secrets from memory or env vars at runtime
      - shell-capable agents reading credential files later with commands like `cat`, even if you tried to discourage that in prompts or ignore files

      The core rule for this course is simple:

      > The agent should almost never see the plaintext secret.

      A secure local MCP setup starts by separating **secret storage**, **secret reference**, and **secret use**.

      A strong mental model is: treat the agent as a tenant that gets **access through tools**, not **custody of the secret**.

  - id: what-1password-changes
    type: concept
    title: What 1Password Changes in a Local Agent Workflow
    content: |
      1Password gives you a better pattern than hardcoding or copy-pasting secrets.

      The diagram below is the core mental model for this course: 1Password CLI reads a secret reference, delegates decryption to the trusted desktop app, and launches your app with the real secret injected at process startup.

      ![Diagram: how 1Password CLI securely injects secrets into your app at process startup](courses/images/1pass-cli.png)

      Instead of scattering plaintext credentials across shell history, dotfiles, and agent configs, you keep the real secret inside 1Password and use:

      - the desktop app for authenticated access
      - the `op` CLI for local workflows
      - **secret references** like `op://vault/item/field`
      - a local trust boundary where the LLM sees tool names and results, but not raw credential material

      That changes the security posture of the whole system.

      A secret reference is not the secret itself. It is an address that can be resolved at runtime by a trusted local tool.

      This maps naturally onto local MCP: the host and MCP server run on your machine, the trusted local layer resolves secrets at runtime, and the LLM operates through tools instead of becoming a secret holder.

  - id: setup-1password-locally
    type: concept
    title: Set Up and Authenticate 1Password Locally
    content: |
      A simple local setup looks like this:

      1. Install the 1Password desktop app
      2. Install the 1Password CLI
      3. Turn on the desktop app integration
      4. Authenticate in the shell through the app-backed flow

      Mac-oriented commands and links:

      ```bash
      brew install --cask 1password-cli
      ```

      Desktop app:

      [1Password Downloads](https://1password.com/downloads/mac)

      Developer docs:

      - [1Password CLI: terminal access, secret references, and runtime secret injection](https://www.1password.dev/cli)
      - [Use the 1Password desktop app to sign in to 1Password CLI](https://www.1password.dev/cli/app-integration)

      In the desktop app, open:

      `Settings -> Developer -> Integrate with 1Password CLI`

      Once this is enabled, the CLI can authenticate using the desktop app instead of forcing you into a more brittle manual sign-in flow.

      A common local flow uses:

      ```bash
      eval $(op signin)
      ```

      In current 1Password documentation, running an `op` command such as `op vault list` or `op signin` triggers app-backed authentication.

      If your organization uses SSO, this detail matters: a manual password-based flow may fail with errors like "This account doesn't support password authentication". In that case, the correct local-dev pattern is to sign into the desktop app via SSO first, then let the CLI piggyback that trusted session.

      Benefits:

      - better local UX
      - less credential sprawl
      - biometric unlock support where available
      - local activity visibility inside the 1Password developer tools

      The important architectural point is not the installer. It is that the local app becomes the trust anchor for the CLI.

      This is a better fit for a developer-operated local agent workflow than sprinkling secrets directly through shell profiles and config files.

  - id: quiz-setup-basics
    type: challenge
    kind: multiple-choice
    title: Check Your Understanding — Setup Basics
    question: What is the safest reason to use the 1Password desktop app integration with the `op` CLI in a local MCP workflow?
    choices:
      - id: a
        text: It makes it easier to paste secrets into prompts
      - id: b
        text: It lets the local toolchain authenticate through the app so secrets can stay in 1Password instead of being copied into config files
        correct: true
      - id: c
