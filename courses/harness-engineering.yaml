id: harness-engineering
title: "Harness Engineering"
description: Understand how AI agent architectures evolved from prompt engineering through context engineering to the new paradigm of harness engineering — and why it matters.
icon: git-branch
version: "1.0"
tags:
  - AI
  - Agents
  - Context Engineering
  - Harness Engineering
  - Architecture

steps:

  - id: intro-video
    type: concept
    title: "Watch: The Evolution of Agent Architectures"
    content: |
      This course is based on Caleb Bright's breakdown of harness engineering —
      one of the most clarifying explanations of how AI coding agents actually
      work under the hood.

      Watch the full video first, then work through the slides to break it down
      concept by concept.

      https://www.youtube.com/watch?v=1a1VXDdIyrk

      By the end of this course you will be able to:

      - Define **prompt engineering**, **context engineering**, and **harness engineering** — and explain how they relate
      - Describe the key limitations that drove each evolution
      - Explain what an **agent loop** is and why it produces better results
      - Recognise harness engineering in tools like Cursor, Roo, and Anthropic's demos

  - id: prompt-engineering
    type: concept
    title: "Layer 1: Prompt Engineering"
    content: |
      The earliest approach to getting useful output from LLMs was **prompt
      engineering** — crafting the text you send to the model carefully enough
      that the response is reliable and useful.

      ### What it is

      Prompt engineering is about *what you say* to the model and *how you say
      it*:

      - Writing clear, specific instructions
      - Giving examples (few-shot prompting)
      - Defining the model's persona ("You are a senior software engineer…")
      - Structuring the output format you want

      ### Why it wasn't enough on its own

      In 2022, ChatGPT launched with a context window of only **~4,000 tokens**.
      That's roughly 3,000 words — enough for a conversation, but not enough to
      work on a real codebase.

      A well-crafted prompt could produce a good *single response*, but for
      anything requiring multiple steps, file access, or sustained reasoning,
      a one-shot prompt just produced sketchy, incomplete results.

      > Prompt engineering defines *who the agent is* and *what its persona is*.
      > It remains a component of every modern agent — but it is now the
      > smallest layer in the stack.

  - id: context-engineering
    type: concept
    title: "Layer 2: Context Engineering"
    content: |
      As the limitations of pure prompt engineering became clear, developers
      began asking a different question: **how do we manage the context window
      more efficiently?**

      This gave rise to **context engineering** — a set of techniques for
      dynamically loading only the information the model needs, at the moment
      it needs it.

      ### The three pillars of context engineering

      | Technique | What it does |
      |-----------|-------------|
      | **Tool calling** | Agent reads only the specific files relevant to the current task; creates external actions |
      | **MCP (Model Context Protocol)** | Adds vendor-specific capabilities on top of the base model |
      | **RAG (Retrieval-Augmented Generation)** | Connects custom databases so relevant data is available on demand |

      ### Why it was transformative

      These techniques made the first wave of serious coding agents possible.
      Tools like **Cursor**, **Windsurf**, **Cline**, **Roo**, and **Aider**
      all adopted tool calling for context engineering — and they were
      genuinely good tools that got real work done.

      As underlying models grew their context windows (from 4K → 32K → 128K+
      tokens), context engineering let agents take on progressively longer tasks.

  - id: context-engineering-limits
    type: concept
    title: "The Limits of Context Engineering"
    content: |
      Context engineering was powerful, but it hit a fundamental ceiling for
      very long-duration tasks.

      ### The summarisation trap

      When a task runs long enough that the context window starts to fill up,
      agents using context engineering resort to **context summarisation** —
      compressing previous work to make room for new input.

      This creates serious problems:

      - The agent may **assume a task is already finished** after summarising it
      - It may **oversimplify** what was done, skipping verification steps
      - Partially completed features get marked as done
      - Bugs go untested because the agent "remembers" testing work it never did

      ### What this looks like in practice

      > You ask an agent to clone an entire website. A few hours in, the context
      > fills. The agent summarises, assumes some features are complete, and
      > continues. You end up with a website where some buttons don't work and
      > features are only half-implemented.

      The elastic, self-managing context window gave the *appearance* of
      long-range capability — but wasn't truly reliable for large-scope tasks.

      ### Early workarounds

      Developers experimented with:
      - **Sub-agents** — hierarchical context management where a coordinator spawns specialised agents
      - **Agent swarms** — multiple agents each with their own fresh context window

      These worked, but were complex to orchestrate. Something better was needed.

  - id: quiz-three-layers
    type: challenge
    kind: multiple-choice
    title: "Check Your Understanding — The Three Layers"
    question: "A developer asks a coding agent to clone an entire website. The agent runs for hours, then produces a result where half the buttons don't work. What is the most likely root cause?"
    choices:
      - id: a
        text: The prompt was poorly written — prompt engineering would have fixed this
      - id: b
        text: Context summarisation caused the agent to falsely assume some tasks were complete
        correct: true
      - id: c
        text: The model's context window was too small to hold any code at all
      - id: d
        text: Tool calling was not available for this type of task
    explanation: |
      This is the classic symptom of context engineering's limitation for long
      tasks. As the context fills, the agent summarises — and in doing so may
      assume work is done that was never actually completed or tested.

  - id: harness-engineering-intro
    type: concept
    title: "Layer 3: Harness Engineering"
    content: |
      **Harness engineering** emerged in early 2026 to describe something that
      developers had been converging toward through sub-agents and swarms: a
      structured *environment* that controls how an agent runs, rather than
      just what it is told.

      ### The core insight: loops with fresh context

      Instead of one long continuous run where the context grows and eventually
      degrades, harness engineering introduces **loops**:

      1. The agent starts each iteration with a **fresh, clean context**
      2. Each iteration has a **strict rule** about how to start and finish
      3. The agent picks **one task** from a requirements document, completes it, tests it, and documents it
      4. The loop repeats until all tasks are done

      ### Why this works

      - No summarisation trap — each loop starts fresh
      - Each task is **small and bounded** — the agent can't "assume" it's done
      - Each step is **tested and documented** before moving on
      - The orchestration layer (the harness) enforces quality gates

      > Think of the harness as a factory floor, not a conversation.
      > The agent is a worker on an assembly line — each station is clean,
      > the rules are explicit, and nothing moves forward until the current
      > step passes inspection.

  - id: our-job-is-to-write-loops
    type: concept
    title: "Our Job Is to Write Loops"
    content: |
      The shift in how we work is already happening.

      > "I don't prompt Claude anymore. I have loops that are running. They're the ones that are prompting Claude and figuring out what to do. **My job is to write loops.**"
      > — Boris Cherny, Head of Claude Code, Anthropic

      https://x.com/sairahul1/status/2063547299167711308

      A year ago, developers wrote code with autocomplete. Then they prompted the model directly. Now the next abstraction is here: you write the loop, and the loop handles the prompting.

      ![Diagram: the agentic loop — perceive, reason, act, observe, repeat](courses/images/agentic-loop.png)

      The harness **is** the loop. Your job as the harness engineer is to define:

      - what the agent sees at the start of each iteration
      - what a valid completion looks like
      - what happens when the iteration passes or fails
      - when the loop is done

  - id: harness-architecture
    type: concept
    title: "What a Harness Looks Like in Practice"
    content: |
      The elegant surprise of harness engineering is how **simple** the
      architecture actually is. Several open-source examples demonstrate this.

      ### The typical harness pattern

      ```
      1. Generate a large requirements document (PRD / task list)
      2. Convert the task list to a structured format (e.g. JSON)
      3. LOOP:
           a. Select ONE unfinished task
           b. Give the agent a fresh prompt + fresh context for that task
           c. Agent implements the task
           d. Agent tests and documents the result
           e. Mark task complete in the requirements document
         UNTIL all tasks complete
      ```

      ### Real-world examples

      [**Ralph Loop**](https://x.com/agrimsingh/status/2010412150918189210) — took over the internet for how effective (and simple) it was:
      - Creates a production requirements document
      - Converts it to a JSON task list
      - Loops feature-by-feature until completion
      - Repository is remarkably small and readable
      - Hear from the author [Geoffrey Huntley](https://www.youtube.com/watch?v=SB6cO97tfiY)

      **Anthropic's simple harness demo**:
      - Lightweight, minimal environment
      - Same loop-based architecture
      - Open-sourced as a reference implementation

      **Cursor's cloud agents**:
      - Run entirely in the cloud — you can close your laptop and the job continues
      - Creates a pull request when finished
      - Integrates with Slack so you can trigger agents via message

      ### The key observation

      > The harness repository is always *tiny*. The power comes from the loop
      > structure, not from complex orchestration code.

  - id: claude-agent-loop
    type: concept
    title: "The Claude Agent Loop"
    content: |
      The most effective AI agents today are built on a clean three-phase loop. It powers Claude Code, and Anthropic has formalised it as the [**Claude Agent Loop**](https://code.claude.com/docs/en/agent-sdk/agent-loop) — a reusable framework for building agents across any domain.

      ### Phase 1 — Gather Context

      Before acting, the agent loads what it needs to know:

      - **Subagents** parallelize context gathering for efficiency
      - **Compaction and context maintenance** keep the window clean across iterations
      - **Agentic / semantic / hybrid search** retrieves the most relevant context — hybrid approaches (keyword + vector) work especially well for coding domains

      ### Phase 2 — Take Action

      The agent does the work:

      - **Tools and prebuilt MCP servers** for structured capabilities
      - **Bash / scripts / Skills** for fast, composable operations
      - **Code generation and execution** for dynamic behavior
      - Routing and code execution can also enhance MCP efficiency — similar to how LLM routing increases throughput in multi-model systems

      ### Phase 3 — Verify Output

      The agent checks its own work before the loop continues:

      - **Rule-based verification** for clear pass/fail criteria
      - **Visual feedback** — increasingly important in multimodal tasks
      - **LLM-as-a-Judge** for fuzzy quality rules where rigid checks fall short
      - Keep it proportionate: reach for computer-using agents only when a well-crafted script won't do the job

      ### Why this matters

      This is not a theoretical model. It is the architecture that ships in real tools. When you understand the three phases, you can diagnose where a loop breaks down, tune each phase independently, and compose more reliable agents.

  - id: how-layers-relate
    type: concept
    title: "How the Three Layers Work Together"
    content: |
      A critical clarification: **harness engineering does not replace prompt
      or context engineering**. It *encompasses* them.

      ### The stack

      | Layer | Role in a modern agent |
      |-------|----------------------|
      | **Prompt engineering** | Defines who the agent is; gives it persona and baseline instructions. Still present in every agent's system prompt. |
      | **Context engineering** | Manages what information is loaded into each iteration. Tool calling, MCP, RAG still apply — now scoped to one task at a time. |
      | **Harness engineering** | Defines the environment: the loop, the task selection rules, the quality gates, the fresh-context constraint. |

      ### The paradigm shift

      The shift is not about better prompts or smarter context loading. It's
      about **changing the environment** the agent operates in:

      - From: one long continuous run where the agent manages itself
      - To: a series of bounded iterations, each governed by explicit rules

      When you look at open-source agents like Cline today, you see all three
      layers working together — a well-written system prompt (prompt
      engineering), intelligent file reading (context engineering), and a
      loop-based task structure (harness engineering).

  - id: flashcard-review
    type: challenge
    kind: flashcards
    title: "Three Layers — Flashcard Review"
    cards:
      - front: What is prompt engineering?
        back: Crafting the text sent to the model — instructions, persona, examples, and output format. It defines who the agent is. Present in every agent but now the smallest layer.
      - front: What is context engineering?
        back: Dynamically managing what information is loaded into the context window. Key techniques are tool calling (read only relevant files), MCP (vendor capabilities), and RAG (on-demand data retrieval).
      - front: What is harness engineering?
        back: Defining the environment the agent operates in — specifically a loop where each iteration gives the agent a fresh context, a single bounded task, and a quality gate before moving on.
      - front: What is the "summarisation trap" in context engineering?
        back: When a long-running agent's context fills up, it compresses (summarises) previous work to continue. This can cause it to falsely mark tasks as done or skip testing — producing incomplete results.
      - front: Why is the harness loop so effective?
        back: Each iteration starts with a fresh, clean context. Tasks are small and bounded. The agent tests and documents each step before moving on. There is no context degradation over time.
      - front: Name two real-world examples of harness engineering in production.
        back: Ralf (creates a PRD, loops feature-by-feature, tiny repo) and Cursor's cloud agents (run off-device, create PRs, integrate with Slack).
      - front: Does harness engineering replace prompt engineering?
        back: No. Harness engineering encompasses prompt and context engineering. A modern agent still has a well-written system prompt (prompt engineering) and smart context loading (context engineering) inside each harness iteration.

  - id: what-is-a-claw
    type: concept
    title: "Whats a Claw?"
    content: |
      By early 2026, **harness engineering** had moved from theory to production runtimes. A family of practical **agent runtimes** emerged under the nickname **Claw** (starting with **[OpenClaw](https://openclaw.ai/)**, see also: [33min video intro](https://x.com/MatthewBerman/status/2023843493765157235)).

      A **Claw** is a *concrete implementation* of a harness — the actual engine that runs the agent loop you design. It handles the always-on execution, tool dispatch, context/memory lifecycle, triggers, and persistence so the loop can operate reliably without constant human babysitting.

      > If **harness engineering** is the discipline of *writing loops and quality gates*, a Claw is the runtime that **executes** that loop in the real world.

      ### The Claw Family (Key Examples)

      | Claw                  | Primary Focus                              | Tech Highlights                                              | Best For                                              |
      |-----------------------|--------------------------------------------|--------------------------------------------------------------|-------------------------------------------------------|
      | **[OpenClaw](https://openclaw.ai/)**         | Full-featured foundation                   | Rich memory, tools, multi-channel, plugins                   | General personal & coding agents (very early! unsafe! suffered hacks!)                      |
      | **[Hermes](https://github.com/NousResearch/hermes-agent)**           | Self-improving agent runtime               | Skills system, persistent memory, sub-agents, MCP support    | Long-running agents that learn and improve over time (popular for home agents) |
      | **[NemoClaw](https://github.com/NVIDIA/NemoClaw)** + **[OpenShell](https://developer.nvidia.com/blog/run-autonomous-self-evolving-agents-more-safely-with-nvidia-openshell/)** | Sandboxed w/ governance | NVIDIA stack + policy engine                                 | Enterprise-ready always-on agents at scale (most safe)                        |

      **Honorable mentions:** **[IronClaw](https://github.com/nearai/ironclaw)** (Rust + WASM sandboxes), **[ZeroClaw](https://zeroclaw.net/)** (Rust, <5 MB RAM, <10 ms startup), **[NullClaw](https://github.com/nullclaw/nullclaw)** (Zig, 678 KB static binary, ~1 MB RAM), **[PicoClaw](https://github.com/sipeed/picoclaw)** (Go, <10 MB RAM, <1s boot, multi-arch static binary), and **[MimiClaw](https://github.com/memovai/mimiclaw)** (Pure C, no OS, ESP32-class hardware, ~0.5W power).

      ### Harness Frameworks (Often Layered on Claws)

      These patterns and tools are commonly used **with** or **on top of** a claw runtime:

      - **[Beads](https://github.com/gastownhall/beads)** (Steve Yegge): Persistent memory + work-tracking system. Agents use a simple `bd` tool so they never lose track of long-horizon tasks across sessions.
      - **[GasTown](https://github.com/gastownhall/gastown)** (Steve Yegge): Multi-agent orchestrator. Runs dozens of **[Claude Code](https://code.claude.com/)** / claw instances in parallel with defined roles (**Mayor** orchestrates, **Polecats** execute, **Witness**/**Deacon** monitor health, etc.). Think *"factory floor supervisor"* or lightweight Kubernetes for agents.
      - **[GStack](https://github.com/garrytan/gstack)** (Garry Tan): 23+ opinionated slash-command **skills** that turn **[Claude Code](https://code.claude.com/)** (and compatible agents) into a *virtual engineering team* — CEO, Eng Manager, Designer, QA Lead, Security Officer, Release Manager, etc. Extremely popular for structured, high-quality coding workflows.
        - **[GBrain](https://github.com/garrytan/gbrain)** (Garry Tan): Persistent memory & knowledge layer. Self-wiring knowledge graph, structured memory, skillpacks. Giving claws (OpenClaw, Hermes, etc.) long-term memory.

  - id: final-quiz
    type: challenge
    kind: multiple-choice
    title: "Final Check — Harness Engineering"
    question: "Which of the following best describes what makes harness engineering different from context engineering?"
    choices:
      - id: a
        text: Harness engineering writes better prompts that prevent the agent from making mistakes
      - id: b
        text: Harness engineering uses larger context windows so summarisation is never needed
      - id: c
        text: Harness engineering changes the environment — running the agent in a loop with fresh context and bounded tasks at each iteration, rather than one long continuous run
        correct: true
      - id: d
        text: Harness engineering replaces tool calling and RAG with a single unified memory system
    explanation: |
      The key insight is that harness engineering is an environmental change,
      not a prompt or context improvement. By running the agent in a structured
      loop — fresh context, one task, test-and-document, repeat — you sidestep
      the summarisation trap entirely and get reliable results on long-duration
      tasks.
