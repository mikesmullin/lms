  - id: video-spotify
    type: concept
    title: "Watch: Spotify's Approach to AI Agents"
    content: |
      This talk shows how Spotify scaled AI-assisted development across a large engineering org, then adapted its developer experience for teams and agents working together.

      https://www.youtube.com/watch?v=zFslvuvYifQ

      Key ideas to listen for:
      - Spotify runs at large scale: thousands of engineers, thousands of daily deployments, and a 40M-line backend monorepo.
        - More than 99% of Spotify engineers use AI coding tools every week.
        - 94% of engineers report that AI tooling has helped them become more productive.
        - PR frequency is up 76%, with most shipped PRs now authored by an AI agent together with a developer.
      - **[Honk](https://engineering.atspotify.com/2025/11/spotifys-background-coding-agent-part-1)** is Spotify’s background coding agent. It wraps Claude through the [Agent SDK](https://docs.anthropic.com/en/docs/agents-and-tools), runs in Spotify’s harness, uses trusted tools, verifies changes in CI, and connects to **[Fleetshift](https://backstage.spotify.com/fleetshift)** for large migration work.
      - **Chirp** turns agent work into a shared, multiplayer workflow where teams can coordinate many Honk sessions instead of treating agents as one-person chat tools.
      - **[Backstage](https://backstage.io/)**, standard stacks, golden paths, lint checks, and static analysis make the codebase easier for both humans and agents to navigate.
      - As coding becomes less constrained, bottlenecks move toward product judgment, planning, review load, and deciding where human oversight matters most.

  - id: using-linters
    type: concept
    title: "Using Linters as a Feedback Loop"
    content: |
      One of the highest-leverage moves in vibe coding is giving the LLM **immediate, executable feedback** via linters instead of relying only on long documentation files.

      ### Why This Works So Well

      - The linter returns **file + line-range citations** with specific warnings
      - The LLM can immediately act on that feedback in the same session
      - It creates a **virtuous cycle**: generate → lint → fix → repeat
      - The context window stays relatively light because only the relevant feedback is injected
      - Documentation can live in the linter rules (and sprawl as much as needed) without bloating every prompt

      This is often **more effective** than putting everything in a `docs/` directory, because the linter surfaces the *right* rule at the *right* time.

      ### Recommended Tool: code-reviewer

      I strongly recommend using **[code-reviewer](https://github.com/mikesmullin/code-reviewer)** (or building something similar).

      What makes it special:
      - It supports **LLM-powered linter rules** in addition to deterministic ones
      - You can encode *subjective* standards (“Is this code readable? Does it follow our team’s philosophy?”) and have an LLM judge them
      - It returns structured, actionable feedback the agent can consume directly

      ### Layered Review Strategy (Recommended)

      1. **Deterministic linters** first ([Spectral](https://github.com/stoplightio/spectral), [OPA](https://www.openpolicyagent.org/), [ESLint](https://eslint.org/), etc.)
      2. **LLM-powered subjective rules** (via code-reviewer or similar)
      3. **Human review + final approval**

      With this layering, the human reviewer usually only has to look at a small number of remaining issues. Over time, patterns that keep reaching the human layer become new linter rules — continuously raising the floor.

  - id: modular-design
    type: concept
    title: "Designing Modular, LLM-Friendly Codebases"
    content: |
      AI agents work dramatically better when your codebase is intentionally designed to be modular and digestible.

      ### Core Guidelines

      - **Aim for ≤ 500 lines per file**
      - **Aim for ≤ 50 lines per function**
      - Prefer **high normalization** and **very low coupling** between systems
      - Each system should be independently understandable, testable, and reviewable by the LLM

      When systems are small and loosely coupled, the agent can load just the relevant context for a task instead of trying to hold the entire codebase in its context window.

      ### Two Architectures That Work Especially Well

      **1. Entity Component System (ECS) + Archetypes**

      ECS is excellent for LLM-assisted development because:
      - Behavior is broken into small, focused **systems**
      - Data lives in **components**
      - Entities are just collections of components
      - Systems operate on archetypes (groups of entities with the same components)

      This creates natural boundaries and makes it easy to add or modify behavior without touching unrelated code.

      **2. Agent Pipeline Architecture**

      Think of this as a **game engine loop** for your agentic workflows:

      - A main loop that invokes a series of **stages** (systems) in order
      - Each stage does one focused job and passes data forward
      - Stages can be independently developed, tested, and reasoned about

      This pattern is especially powerful for agentic loops because it mirrors how the agent itself thinks (perceive → reason → act → observe) while keeping each piece small.

      Both approaches let you break large problems into reusable, independently verifiable pieces that stay comfortably inside context windows.

  - id: token-efficiency
    type: concept
    title: "Measuring & Optimizing Token Efficiency"
    content: |
      As you become more advanced, it becomes valuable to track not just output quality, but **efficiency**.

      ### Why Track This?

      A good agentic engineer cares about:
      - Wall-clock time
      - Tokens / cost spent
      - Overall output quality

      The goal is to finish tasks more efficiently than the average practitioner (sometimes called **tokenmaxxing** — but with a focus on *smart* usage, not just burning tokens).

      ### Recommended Tooling

      Build or use a tool that can:
      - Read your editor sessions
      - Calculate wait time + input/output tokens
      - Show cost per session
      - Count tokens in files (to test fit in 200k / 1M context windows)

      Having visibility into your actual spend and efficiency helps you continuously improve your workflow.

  - id: debugging-when-lost
    type: concept
    title: "Debugging When the LLM Gets Lost"
    content: |
      Even with good specs and indexing, agents can get stuck on complex bugs. Here’s how to recognize it and steer the process effectively.

      ### Signs the LLM Is Lost

      - It spends a very long time “thinking” before responding
      - It has made several attempts but keeps circling or regressing
      - Reproducing the problem takes many slow steps (poor iteration speed)

      When you see these patterns, shift from “generate code” mode into **debugging mode**.

      ### Effective Debugging Techniques

      **1. Traces (Critical Path Logging)**  
      One of the highest-leverage moves: ask the agent to add temporary log output prefixed with `file:lineno` at each step along the suspected path.  
      Optionally include timers to measure elapsed time.  
      The agent can then stop guessing and reason directly from the actual runtime output.  
      This works for stdout, devtools console, or even captured screenshots at key points.

      **2. Standalone Tests**  
      When reproduction is slow, give the agent a focused, runnable test it can iterate on quickly.  
      Use mocks for non-essential systems so it can isolate the problematic logic.  
      These tests can be added to a normal test suite (or triggered selectively) for long-term stability.

      **3. MCP Debugger**  
      Empower the agent to drive an interactive debugger instead of just reading code.  
      Example: [mcp-bun-debug](https://github.com/mikesmullin/mcp-bun-debug) for Bun/JavaScript.

      **4. MCP Browser Tools**  
      For UI or operational flows, let the agent observe or interact with the actual running application:  
      - Built-in VS Code browser tool (often the strongest)  
      - [mikesmullin/browser](https://github.com/mikesmullin/browser) (headless `browser-use` wrapper)  
      - [browsermcp](https://browsermcp.io/) (controls your existing browser session/cookies)

      **5. Smoke Tests**  
      A lightweight, mostly-English set of instructions that describes a realistic user flow or integration scenario.  
      The agent can run a “smoke test” after changes and will usually generate comprehensive coverage.  
      These can live in a markdown file or be promoted into a repeatable test suite.

      These techniques dramatically improve iteration speed and help the agent get unstuck without burning excessive tokens or context.

