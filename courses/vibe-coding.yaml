  - id: final-quiz
    type: challenge
    kind: multiple-choice
    title: "Final Check — Vibe Coding"
    question: "For a 25M+ line codebase, what does the course identify as the real frontier for making reliable vibe coding possible?"
    choices:
      - id: a
        text: Put the full repository into a larger raw context window and let the model sort it out
      - id: b
        text: Strong indexing and retrieval systems that let agents dynamically fetch only the relevant parts of the codebase
        correct: true
      - id: c
        text: Avoid documentation so the agent spends all of its context budget on source files
      - id: d
        text: Use only vector embeddings and avoid structural or graph-based code analysis
    explanation: |
      Large raw context windows are not enough for true monorepos. Reliable large-scale vibe coding depends on strong retrieval: hybrid search, AST-aware chunking, code graphs, codemaps, and MCP-style tools that fetch relevant context on demand.