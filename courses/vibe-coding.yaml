id: vibe-coding
title: "Vibe Coding: Building with AI"
description: "Practical techniques for writing specs, designing modular systems, using linters as feedback loops, and getting reliable, high-quality results from AI coding agents."
icon: code
version: "1.0"
tags:
  - AI
  - Coding
  - Vibe Coding
  - Specs
  - Architecture
  - Productivity

steps:
  - id: intro
    type: concept
    title: "Welcome to Vibe Coding"
    content: |
      **Vibe coding** is the art of getting dramatically better results from AI coding agents by focusing on the inputs and environment you control — rather than trying to micromanage every line of generated code.

      ![Vibe Coding](courses/images/vibe-coding.jpg)

      The core philosophy is simple:

      - Spend the majority of your time on **high-leverage inputs** (specs, architecture, feedback mechanisms)
      - Let the agent handle the mechanical work of writing code
      - Use tight feedback loops (especially linters) so the agent can self-correct

      By the end of this course you will be able to:

      - Run an effective “Plan Mode” workflow to think through ideas before writing code
      - Write specs that produce reliable code on the first or second try
      - Use voice effectively for development
      - Work with multiple parallel sessions and forks
      - Create clear, actionable documentation (PRDs and TDDs)
      - Use ASCII art wireframes to get consistent UI/UX results
      - Set up powerful linter feedback loops (including LLM-powered subjective rules)
      - Design modular codebases that stay well within context windows
      - Measure and optimize your token and time efficiency

  - id: video-airbnb
    type: concept
    title: "Watch: AirBnB's Approach to Agentic Coding"
    content: |
      This talk shows how Airbnb's developer platform team brought agentic coding into real engineering workflows without forcing every developer into the same tool or surface.

      https://www.youtube.com/watch?v=o6oYc9-X9Iw

      Key ideas to listen for:
      - Airbnb frames agentic coding through the pair-programming analogy: the human becomes the navigator while agents materialize code changes.
      - Their early 2025 forecast expected 20-40% agentic PR adoption by year end, but they were already around the low 60% range when the talk was recorded.
      - They measure progress holistically: developer sentiment, tool usage/adoption, and objective engineering-system metrics like PR velocity.
      - Human review still matters; engineers need to understand and challenge the generated diff before submitting it for another human review.
      - Parallel agentic sessions work best with sandboxed cloud workspaces, strong code review culture, and tooling around the agent, not just the agent itself.
      - Airbnb's strategy was to bring agents to Airbnb and Airbnb to agents: **AirChat** (their internal agent deployment abstraction), CLI/IDE surfaces, **[MCP servers](https://modelcontextprotocol.io/)**, internal knowledge, auth, security review paths, and templates all make the workflow usable at company scale.

  - id: plan-mode
    type: concept
    title: "Writing Specs: Plan Mode"
    content: |
      Before writing a formal PRD, TDD, or spec, many experienced vibe coders use a personal **Plan Mode** workflow. This is where the majority of the “80% spec time” actually happens.

      ### How Plan Mode Works

      1. **Start with a blank scratchpad** (usually a dedicated Markdown file).
      2. Tell the agent it can **only edit this one file** until you explicitly say “exit plan mode”.
      3. Begin dumping thoughts as a **bullet hierarchy** (voice input works great here — it can be messy).
      4. Once the core ideas are captured, ask the agent to generate more formal artifacts:
         - Data models and schemas
         - Class hierarchies (as Mermaid diagrams)
         - ASCII wireframes
         - API contracts
      5. Use precise citation methods for corrections:
         - Select lines in VS Code → `Ctrl+L` ([Copy Relative Path and Line Numbers](https://marketplace.visualstudio.com/items?itemName=ezforo.copy-relative-path-and-line-numbers)) → paste file + line range into a bullet list like `- {{file:line}} {{instructions}}`
         - Or use inline markers like `>>> EDITORS_NOTE: {{instructions}}` below the relevant line
      6. End the plan mode with this powerful closing instruction:

         > Ask me clarifying questions. Ask for permission before proceeding to edit code.

      ### Why This Works So Well

      Because you spent so much time thinking through the problem in a structured way, the final generation step often feels like **popcorn** — 2,000–3,000 lines of highly relevant code can appear with 85–90% accuracy on the first try. From there you only need light, targeted corrections using the same citation techniques.

      This approach is **completely tool-agnostic**. It works with any LLM, any editor, and any harness. You stay in full control of the rules of Plan Mode.

  - id: writing-docs
    type: concept
    title: "Writing Docs: PRDs and TDDs"
    content: |
      Good documentation keeps both you *and* the AI aligned over a long project. A **Product Requirements Document** (PRD) and a **Technical Design Document** (TDD) cover similar ground from slightly different angles. Just using these abbreviations is enough for the LLM to generate a good outline, but it's also good for you to know generally this is the type of information you'll be providing in a good plan document:

      ### Combined Outline (good reading order)

      - **Problem Statement** — What user pain or system gap are we solving?
      - **Goals & Success Metrics** — How will we know this is done? (quantitative where possible)
      - **Current State & Problems** — What exists today, and what's broken or missing?
      - **User Personas & Scenarios** — Who is affected and what are their journeys?
      - **Requirements**
        - Functional Requirements
        - Non-Functional Requirements (performance, security, accessibility, etc.)
      - **Scope**
        - In Scope
        - Out of Scope (explicitly stated)
      - **Proposed Solution** — High-level architecture or approach
      - **Detailed Design**
        - Data Models / Schema Changes
        - API / Interface Design
        - Key Algorithms or Flows
      - **Trade-offs & Alternatives Considered**
      - **Testing Strategy**
      - **Timeline & Milestones**
      - **Rollback / Migration Plan**
      - **Risks, Assumptions & Open Questions**
      - **Future Considerations** (Phase 2+, extensibility)

      I usually like to put these type of files in `docs/*.md` alongside the code in the repository. These are a bit more polished than your average plan mode document. If you keep them up to date, they're also reusable; they can be treated like living documents which are great for bootsrapping new prompt sessions, throughout the **Software Development Lifecycle** (SDLC). Because they're human readable, they're also serving as great documentation onboarding for any new contributors to the project.

  - id: ascii-wireframes
    type: concept
    title: "Wireframing GUIs in ASCII Art"
    content: |
      One of the most reliable techniques for getting good UI/UX from LLMs is to provide **ASCII art wireframes**.

      ### The Technique

      1. Draw a simple ASCII wireframe.
      2. Use **unique symbols** for every distinct component instance (letters, words, emojis, or short labels).
      3. Immediately follow the diagram with a `WHERE:` section.
      4. For each symbol, explain: **look**, **feel**, **behavior**, and **purpose**.

      This combination dramatically reduces ambiguity and gives the model a clear mental model of the interface.

      ### Example

      ```text
      +-----------------------------+
      |  [H]                        |
      |-----------------------------|
      |  [S]           |  [M]       |
      |                |            |
      |                |            |
      |                |  [O]       |
      |-----------------------------|
      |  [F]                        |
      +-----------------------------+
      ```

      **WHERE:**

      - `[H]`: Top navigation bar. Dark background, white text. Contains logo (left) and user avatar + menu (right). Sticky on scroll.
      - `[S]`: Left sidebar navigation. Light gray background. Collapsible on mobile. Contains primary navigation links with icons.
      - `[M]`: Main content area. White background with subtle card shadows. Displays the primary page content.
      - `[O]`: Form area. Display each field with progressive disclosure.
      - `[F]`: Footer. Small text, centered. Contains legal links and copyright. Hidden on very small screens.

      As you can see, it is a way to concisely describe both form (layout) and function.

  - id: flashcard-plan-docs-wireframes
    type: challenge
    kind: flashcards
    title: "Review — Foundations, Docs & Wireframes"
    cards:
      - front: What is the core philosophy of vibe coding?
        back: Focus on high-leverage inputs like specs, architecture, and feedback mechanisms, then let the agent handle the mechanical work of writing code.
      - front: What restriction defines Plan Mode?
        back: The agent can only edit the dedicated scratchpad file until you explicitly exit plan mode.
      - front: What kinds of artifacts can Plan Mode produce before code generation?
        back: Data models, schemas, class hierarchies, Mermaid diagrams, ASCII wireframes, API contracts, and similar planning artifacts.
      - front: Why keep PRDs and TDDs in docs/*.md alongside the code?
        back: They stay reusable across sessions, support the SDLC, and help onboard both AI agents and human contributors.
      - front: What makes an ASCII wireframe useful to an LLM?
        back: "A simple diagram with unique symbols followed immediately by a WHERE: section that explains each symbol's look, feel, behavior, and purpose."

  - id: writing-specs
    type: concept
    title: "Writing Specs: The 80/20 Rule"
    content: |
      The single highest-leverage habit in vibe coding is **spending far more time writing the spec than generating code**.

      > **Rule of thumb**: Spend **80% of your time writing and refining the spec**, and only **20%** actually prompting the model to generate code.

      A good spec acts as a contract. The clearer and more complete it is, the less the model has to guess — and the less you have to correct later.

      ### Spec Frameworks

      Two popular structured approaches have emerged:

      - **[SpecKit](https://www.youtube.com/watch?v=1QpTm_kaCm4)**: A spec-driven flow that typically produces `spec.md` → `plan.md` → `tasks.md`. Excellent for breaking large features into small, verifiable chunks.
      - **[BMAD](https://www.youtube.com/watch?v=1QpTm_kaCm4)** (Blueprint Method for Agentic Development): Uses role-handoff pipelines. Different agents (or agent modes) handle analysis → planning → architecture → implementation with explicit handoffs.

      You don’t *have* to use these frameworks. Many people get excellent results with a well-written Markdown spec + a clear task list.

      **Key principle**: The quality of the output is almost entirely determined by the quality of the spec.

  - id: voice-driven
    type: concept
    title: "Voice-Driven Development"
    content: |
      At this point in vibe coding, many practitioners spend **~80% of their time talking** rather than typing.

      ### Why Voice Works So Well

      - Much faster than typing, especially when tired
      - The LLM is surprisingly good at understanding intent even with typos or rambling
      - You only need to type technical terms and syntax
      - If you mess up a sentence, just rephrase it — no need to backspace
      - Great for brainstorming during Plan Mode

      ### Activation Keywords & Routines

      Many people set up voice commands for repetitive tasks (typing passwords, 2FA, home automation, etc.).

      **Simple option**: Push-to-talk tools like [handy.computer](https://handy.computer/) or [BridgeVoice](https://www.youtube.com/watch?v=VplNyFNo2oI)

      **Advanced option**: Tools with always-on perception and rich tool ecosystems, such as the client-server architecture built around [whisper](https://github.com/mikesmullin/whisper).

  - id: multi-session-forking
    type: concept
    title: "Working with Multiple Sessions & Forks"
    content: |
      Modern editors (especially VS Code + GitHub Copilot) make it easy to work with many prompt sessions in parallel.

      ### Recommended Practices

      - Keep **4–8 windows** open at once when doing complex work
      - Make heavy use of the **fork** feature

      ### Powerful Forking Patterns

      - **Parallel execution**: Fork one session to do deep work while another answers questions or does research (similar to Claude Code’s `/btw` command).
      - **Research forks**: When you need more context, fork a session to gather and summarize information, then paste the report back to the parent.
      - **Task-per-fork**: For a long list of items that each need deep context, create one fork per item. Share learning between forks via a common markdown file.
      - **Specialist-fork**: Divide each fork into specialized roles: front-end, back-end, database, documentation, repo, etc. This way anything you need to do repeatedly will always be in context; You won't need to explain yourself--in fact, you'll even be able to use shorthand notation. (e.g., "punch it!" "deploy it agian", "update again", "again")

      Forking gives you fine-grained control and lets you scale your thinking across multiple focused contexts without losing the parent thread.

  - id: video-parallel-vibe-coding
    type: concept
    title: "Example: Parallel Vibe Coding in Action"
    content: |
      One of the best real-world examples of heavy parallel vibe coding is **Matthew Miller** (@matthewmillerai), founder of BridgeMind.

      He regularly streams long "no talking" sessions where he runs **many AI agents in parallel** across multiple sessions and windows — often 10–16+ agents working simultaneously while he ships features.

      This is a great example of the multi-window + forking workflow taken to an extreme.

      Watch him explain here:

      https://www.youtube.com/watch?v=3eYzhp-o-f4

      You can also watch one of his [4-hour livestreams](https://www.youtube.com/watch?v=NuBXwDZ7jAI) to see him in action.

      Pay attention to how he manages context across many parallel agents and how little verbal explanation he needs once the agents are set up.

