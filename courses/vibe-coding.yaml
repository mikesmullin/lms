    type: challenge
    kind: flashcards
    title: "Review — Tooling, Architecture & Debugging"
    cards:
      - front: Why are linters often more effective than docs/ directories during agentic coding?
        back: They surface the right rule at the right time with precise file and line-range citations the agent can act on immediately.
      - front: What are the three layers of the recommended review strategy?
        back: Deterministic linters first, LLM-powered subjective rules second, and human review plus final approval third.
      - front: What file and function size targets keep a codebase LLM-friendly?
        back: Aim for 500 lines or fewer per file and 50 lines or fewer per function.
      - front: What two architectures does the course highlight for LLM-assisted development?
        back: Entity Component System with archetypes, and Agent Pipeline Architecture with focused stages.
      - front: What should you measure when optimizing token efficiency?
        back: Wall-clock time, tokens and cost spent, and overall output quality.
      - front: What is critical path logging useful for when the LLM gets lost?
        back: It gives the agent concrete runtime output, often prefixed with file and line information, so it can reason from observed behavior instead of guessing.
      - front: Why use standalone tests when reproduction is slow?
        back: They give the agent a fast, focused loop for isolating problematic logic without repeatedly running a slow end-to-end flow.

  - id: large-codebases
    type: concept
    title: "Large Codebases"
    content: |
      At 25 million+ lines of code, simply giving the model more context stops working. The real frontier is **strong indexing and retrieval systems** that let agents dynamically fetch only the relevant parts of the codebase with high precision.

      This is what makes reliable vibe coding possible at enterprise scale.

      ### Why Strong Indexing Matters

      - Raw context windows (even 1M+ tokens) are insufficient for true monorepos.
      - Pure vector embeddings struggle with precise relationships and impact analysis.
      - Good retrieval dramatically reduces context switching and token waste while improving accuracy.

      ### Current Cutting-Edge Techniques

      - **Hybrid Retrieval**: Combines semantic embeddings + AST parsing + dependency/call graphs.
      - **AST-aware Chunking & Symbol Resolution** (Tree-sitter based): Creates semantically meaningful chunks instead of naive text splits.
      - **Code Knowledge Graphs**: Multi-relation graphs (containment, imports, inheritance, invocations) for precise traversal and impact analysis.
      - **Codemaps & Hierarchical Maps**: AI-generated structured overviews of execution flow and component relationships.
      - **Hierarchical / Multi-Stage Retrieval**: Broad semantic search → graph traversal → focused symbol-level detail.
      - **Incremental & Persistent Indexing**: Real-time updates as code changes.

      ### Leading Tools & Approaches (2026)

      | Tool                          | Strengths                                      | Key Techniques                          | Best For |
      |-------------------------------|------------------------------------------------|-----------------------------------------|----------|
      | **[Windsurf Codemaps](https://cognition.ai/blog/codemaps)** | Task-aware hierarchical maps of code relationships | AI-annotated structured maps + graphs  | Large/complex/legacy systems |
      | **[Glean](https://glean.software/)** (Meta) | Production-scale incremental indexing          | Fact collection + powerful querying    | Extremely large internal repos |
      | **[ast-grep](https://ast-grep.github.io/)** | Fast structural search using AST patterns      | Tree-sitter + pattern matching         | Precise refactoring & finding |
      | **[Sourcegraph Cody](https://sourcegraph.com/cody)** | Deep enterprise code intelligence              | Universal code graph + embeddings      | Monorepos & cross-repo work |
      | **[Augment Code](https://www.augmentcode.com/)** | Very large repos with autonomous agents        | Strong Context Engine                  | Enterprise execution at scale |
      | **Hybrid Custom MCPs**        | Flexible & controllable                        | AST + embeddings + graphs              | Tailored agent workflows |

      ### Practical Takeaways for Vibe Coding

      - Treat indexing/retrieval as a first-class part of your harness.
      - Combine semantic search with structural/graph layers for best results.
      - Use tools like Codemaps and ast-grep to give both you *and* the agent better mental models of the system.
      - Keep changes small and bounded — even with great retrieval, large refactors benefit from Plan Mode + verification loops.
      - Build or adopt retrieval via MCP so agents can query the index dynamically instead of hoping the right context is already loaded.
      - Maintain a `docs/` folder in the repo with markdown documentation describing the archicture and every system.
      - Maintain an `AGENTS.md` file describing coding conventions and best practices.

      Strong indexing is what allows the high-leverage, relatively relaxed style of vibe coding to scale beyond small-to-medium projects.
  
  - id: video-stripe
    type: concept
    title: "Watch: How Stripe Approaches AI-Assisted Development"
    content: |
      This talk breaks down Stripe's **Minions** system as an example of production-grade agentic engineering in a high-stakes, large-codebase environment.

      https://www.youtube.com/watch?v=V5A1IU8VVp4

      Key ideas to listen for:
      - **[Minions](https://stripe.dev/blog/minions-stripes-one-shot-end-to-end-coding-agents)** are unattended coding agents that can start from Slack, CLI, or a web interface, then produce a branch, run CI, and prepare a GitHub PR for review.
      - Stripe gives agents warm, isolated dev boxes so they can work in environments that mirror human developer machines while still being parallelizable and predictable.
      - **Blueprints** combine deterministic workflow steps with flexible agent reasoning: run linters, push changes, fix CI failures, and invoke agents only where judgment is useful. (See [Part 2](https://stripe.dev/blog/minions-stripes-one-shot-end-to-end-coding-agents-part-2))
      - Scoped rule files solve the large-context problem by attaching relevant instructions as agents traverse particular directories and file patterns.
      - **The Tool Shed** centralizes hundreds of MCP tools so agents can discover and use the right internal capabilities without loading everything into context.
      - The larger lesson is that reliable agentic engineering comes from **owning the harness**: context, tools, validation, review paths, and the code-plus-agent workflow around the model.

